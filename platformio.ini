[platformio]
description = Library for making LED blinking patterns.

[env]
framework = arduino

[env:uno]
platform = atmelavr
board = uno
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@^1.15.1
    
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328new
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@^1.15.1

[env:feather328p]
platform = atmelavr
board = feather328p
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@^1.15.1
